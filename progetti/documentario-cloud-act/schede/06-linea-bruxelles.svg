<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t06 d06">
  <title id="t06">Bruxelles 2021-2026: l'Italia ha chiesto la sovranita, e ha perso</title>
  <desc id="d06">Linea del tempo in cinque tappe: dalla coautoria italiana del non-paper del 2021 sull'immunita dalle leggi straniere fino alla proposta europea del giugno 2026, che restituisce la decisione agli Stati membri.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="80" y="70" font-family="sans-serif" font-size="42" font-weight="700" fill="#111111">L'ITALIA HA CHIESTO. E HA PERSO.</text>
  <text x="80" y="108" font-family="sans-serif" font-size="23" fill="#6C757D">Cinque anni di negoziato europeo sulla certificazione cloud, 2021-2026</text>
  <line x1="80" y1="128" x2="1520" y2="128" stroke="#111111" stroke-width="3"/>

  <!-- Asse -->
  <line x1="80" y1="470" x2="1500" y2="470" stroke="#111111" stroke-width="5"/>
  <path d="M 1520 470 L 1494 460 L 1494 480 Z" fill="#111111"/>

  <!-- Connettori -->
  <line x1="200" y1="380" x2="200" y2="470" stroke="#0066CC" stroke-width="3"/>
  <line x1="500" y1="470" x2="500" y2="560" stroke="#0066CC" stroke-width="3"/>
  <line x1="800" y1="380" x2="800" y2="470" stroke="#D9364F" stroke-width="3"/>
  <line x1="1100" y1="470" x2="1100" y2="560" stroke="#0066CC" stroke-width="3"/>
  <line x1="1400" y1="380" x2="1400" y2="470" stroke="#6C757D" stroke-width="3"/>

  <!-- Nodi -->
  <circle cx="200" cy="470" r="16" fill="#0066CC" stroke="#111111" stroke-width="2"/>
  <circle cx="500" cy="470" r="16" fill="#0066CC" stroke="#111111" stroke-width="2"/>
  <circle cx="800" cy="470" r="20" fill="#D9364F" stroke="#111111" stroke-width="3"/>
  <circle cx="1100" cy="470" r="16" fill="#0066CC" stroke="#111111" stroke-width="2"/>
  <circle cx="1400" cy="470" r="16" fill="#6C757D" stroke="#111111" stroke-width="2"/>

  <!-- TAPPA 1 -->
  <rect x="80" y="196" width="280" height="184" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <rect x="80" y="196" width="280" height="44" fill="#0066CC"/>
  <text x="220" y="227" font-family="sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">LUGLIO 2021</text>
  <text x="98" y="272" font-family="sans-serif" font-size="17" fill="#111111">L'Italia e COAUTRICE, con</text>
  <text x="98" y="296" font-family="sans-serif" font-size="17" fill="#111111">Francia, Germania e Spagna,</text>
  <text x="98" y="320" font-family="sans-serif" font-size="17" fill="#111111">del non-paper che introduce</text>
  <text x="98" y="344" font-family="sans-serif" font-size="17" fill="#111111">l'immunita dalle leggi</text>
  <text x="98" y="368" font-family="sans-serif" font-size="17" fill="#111111">straniere nell'EUCS.</text>

  <!-- TAPPA 2 -->
  <rect x="360" y="560" width="280" height="184" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <rect x="360" y="560" width="280" height="44" fill="#0066CC"/>
  <text x="500" y="591" font-family="sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">DICEMBRE 2022</text>
  <text x="378" y="636" font-family="sans-serif" font-size="17" fill="#111111">Undici Paesi firmano un</text>
  <text x="378" y="660" font-family="sans-serif" font-size="17" fill="#111111">non-paper contro quei</text>
  <text x="378" y="684" font-family="sans-serif" font-size="17" fill="#111111">requisiti.</text>
  <text x="378" y="712" font-family="sans-serif" font-size="18" font-weight="700" fill="#0066CC">L'ITALIA NON C'E.</text>

  <!-- TAPPA 3 -->
  <rect x="660" y="196" width="280" height="184" fill="#FFFFFF" stroke="#D9364F" stroke-width="4"/>
  <rect x="660" y="196" width="280" height="44" fill="#D9364F"/>
  <text x="800" y="227" font-family="sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">22 MARZO 2024</text>
  <text x="678" y="272" font-family="sans-serif" font-size="17" fill="#111111">La terza bozza RIMUOVE i</text>
  <text x="678" y="296" font-family="sans-serif" font-size="17" fill="#111111">requisiti di sovranita.</text>
  <text x="678" y="320" font-family="sans-serif" font-size="17" fill="#111111">Sparisce il livello High+.</text>
  <text x="678" y="348" font-family="sans-serif" font-size="16" fill="#6C757D">Pressione convergente: industria</text>
  <text x="678" y="370" font-family="sans-serif" font-size="16" fill="#6C757D">USA e dodici Stati membri UE.</text>

  <!-- TAPPA 4 -->
  <rect x="960" y="560" width="280" height="184" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <rect x="960" y="560" width="280" height="44" fill="#0066CC"/>
  <text x="1100" y="591" font-family="sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">17 APRILE 2024</text>
  <text x="978" y="636" font-family="sans-serif" font-size="17" fill="#111111">Il Sottosegretario italiano</text>
  <text x="978" y="660" font-family="sans-serif" font-size="17" fill="#111111">contesta pubblicamente la</text>
  <text x="978" y="684" font-family="sans-serif" font-size="17" fill="#111111">rimozione: i fornitori sotto</text>
  <text x="978" y="708" font-family="sans-serif" font-size="17" fill="#111111">giurisdizione extra-UE</text>
  <text x="978" y="732" font-family="sans-serif" font-size="17" fill="#111111">sarebbero certificati sicuri.</text>

  <!-- TAPPA 5 -->
  <rect x="1240" y="196" width="280" height="184" fill="#FFFFFF" stroke="#6C757D" stroke-width="3"/>
  <rect x="1240" y="196" width="280" height="44" fill="#6C757D"/>
  <text x="1380" y="227" font-family="sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3 GIUGNO 2026</text>
  <text x="1258" y="272" font-family="sans-serif" font-size="17" fill="#111111">La Commissione scrive che</text>
  <text x="1258" y="296" font-family="sans-serif" font-size="17" fill="#111111">l'EUCS non e ancora stato</text>
  <text x="1258" y="320" font-family="sans-serif" font-size="17" fill="#111111">adottato. La decisione torna</text>
  <text x="1258" y="344" font-family="sans-serif" font-size="17" fill="#111111">agli Stati membri, tramite</text>
  <text x="1258" y="368" font-family="sans-serif" font-size="17" fill="#111111">valutazione del rischio.</text>

  <!-- Cautela obbligatoria -->
  <rect x="80" y="404" width="770" height="46" fill="#FFFFFF" stroke="#6C757D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="98" y="434" font-family="sans-serif" font-size="16" fill="#6C757D">L'elenco dei dodici Stati non e pubblico: che l'Italia non ne facesse parte e una deduzione, non un fatto accertato.</text>

  <!-- Conclusione -->
  <rect x="80" y="762" width="1440" height="68" fill="#111111"/>
  <text x="800" y="792" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Per cinque anni l'Italia ha chiesto quella clausola in Europa. Non l'ha mai scritta in casa propria.</text>
  <text x="800" y="818" font-family="sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle">La valutazione del rischio prevista dalla proposta del 2026 non e ancora stata fatta.</text>

  <line x1="80" y1="836" x2="1520" y2="836" stroke="#6C757D" stroke-width="1"/>
  <text x="80" y="858" font-family="sans-serif" font-size="15" fill="#6C757D">Fonte: COM(2026) 502 final, Cloud and AI Development Act, Bruxelles 3.6.2026 - cepInput 8/2025, che cita il titolo del documento olandese sul non-paper DE, ES, FR e IT - EUISS sulla</text>
  <text x="80" y="878" font-family="sans-serif" font-size="15" fill="#6C757D">rimozione del 22 marzo 2024 - dichiarazione del Sottosegretario, 17 aprile 2024. Osservatorio Nazionale Sovranita Digitale, 2026.</text>
</svg>
