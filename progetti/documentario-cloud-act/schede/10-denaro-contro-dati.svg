<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t10 d10">
  <title id="t10">Per il denaro esiste una procedura. Per la vita digitale, no.</title>
  <desc id="d10">Due colonne simmetriche. A sinistra, denaro bloccato: la legge americana prescrive conto fruttifero, interessi maturati, tracciabilita e audit trail, restituzione in caso di delisting. A destra, dati bloccati: quattro caselle vuote, perche non esiste alcuna regola corrispondente. L'assenza di disciplina e essa stessa il risultato.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="80" y="70" font-family="sans-serif" font-size="42" font-weight="700" fill="#111111">PER IL DENARO ESISTE UNA PROCEDURA</text>
  <text x="80" y="108" font-family="sans-serif" font-size="23" fill="#6C757D">Che cosa prescrive la legge americana quando blocca dei fondi, e che cosa prescrive quando blocca dei dati</text>
  <line x1="80" y1="128" x2="1520" y2="128" stroke="#111111" stroke-width="3"/>

  <!-- Intestazioni simmetriche -->
  <rect x="80" y="170" width="710" height="52" fill="#0066CC"/>
  <text x="435" y="205" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">DENARO BLOCCATO</text>
  <rect x="810" y="170" width="710" height="52" fill="#6C757D"/>
  <text x="1165" y="205" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">DATI BLOCCATI</text>

  <!-- Voce 1 -->
  <rect x="80" y="246" width="710" height="76" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <rect x="104" y="272" width="24" height="24" fill="#0066CC"/>
  <text x="150" y="292" font-family="sans-serif" font-size="21" fill="#111111">Conto fruttifero obbligatorio</text>
  <rect x="810" y="246" width="710" height="76" fill="#FFFFFF" stroke="#6C757D" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Voce 2 -->
  <rect x="80" y="336" width="710" height="76" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <rect x="104" y="362" width="24" height="24" fill="#0066CC"/>
  <text x="150" y="382" font-family="sans-serif" font-size="21" fill="#111111">Interessi maturati sulle somme</text>
  <rect x="810" y="336" width="710" height="76" fill="#FFFFFF" stroke="#6C757D" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Voce 3 -->
  <rect x="80" y="426" width="710" height="76" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <rect x="104" y="452" width="24" height="24" fill="#0066CC"/>
  <text x="150" y="472" font-family="sans-serif" font-size="21" fill="#111111">Tracciabilita e audit trail</text>
  <rect x="810" y="426" width="710" height="76" fill="#FFFFFF" stroke="#6C757D" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Voce 4 -->
  <rect x="80" y="516" width="710" height="76" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <rect x="104" y="542" width="24" height="24" fill="#0066CC"/>
  <text x="150" y="562" font-family="sans-serif" font-size="21" fill="#111111">Restituzione se il provvedimento cade</text>
  <rect x="810" y="516" width="710" height="76" fill="#FFFFFF" stroke="#6C757D" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Chiusura a piena larghezza -->
  <rect x="80" y="616" width="1440" height="76" fill="#111111"/>
  <text x="800" y="652" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Per il denaro esiste una procedura. Per la vita digitale, no.</text>
  <text x="800" y="680" font-family="sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle">L'assenza di disciplina non e una lacuna da colmare in seguito: e essa stessa il risultato.</text>

  <!-- Nota -->
  <rect x="80" y="710" width="1440" height="112" fill="#FFFFFF" stroke="#6C757D" stroke-width="2"/>
  <text x="100" y="738" font-family="sans-serif" font-size="18" font-weight="700" fill="#111111">Che cosa manca, esattamente</text>
  <text x="100" y="766" font-family="sans-serif" font-size="17" fill="#6C757D">Per i dati non esiste alcuna regola su conservazione, esportabilita o restituzione: ne una procedura, ne un termine, ne un responsabile.</text>
  <text x="100" y="792" font-family="sans-serif" font-size="17" fill="#6C757D">Il Regolamento di blocco UE non e stato attivato a diciassette mesi dall'ordine esecutivo. Per un ente pubblico italiano il rischio e dichiarato TEORICO.</text>
  <text x="100" y="814" font-family="sans-serif" font-size="16" fill="#6C757D">La colonna di destra e vuota perche vuota e la disciplina, non perche la ricerca sia incompleta.</text>

  <line x1="80" y1="836" x2="1520" y2="836" stroke="#6C757D" stroke-width="1"/>
  <text x="80" y="858" font-family="sans-serif" font-size="15" fill="#6C757D">Fonte: disciplina statunitense sui fondi bloccati (conto fruttifero, interessi, audit trail, restituzione in caso di delisting), a fronte dell'assenza di</text>
  <text x="80" y="878" font-family="sans-serif" font-size="15" fill="#6C757D">disciplina corrispondente per i dati - risoluzioni del Parlamento europeo del 9 luglio e dell'11 settembre 2025. Osservatorio Nazionale Sovranita Digitale, 2026.</text>
</svg>
