  <rect x="640" y="560" width="880" height="230" fill="#FFFFFF" stroke="#D9364F" stroke-width="3"/>
  <text x="664" y="600" font-family="sans-serif" font-size="20" font-weight="700" fill="#D9364F">Qui non sappiamo.</text>
  <text x="664" y="634" font-family="sans-serif" font-size="18" fill="#111111">Nel catalogo delle qualificazioni ACN il primo fornitore per numero di servizi</text>
  <text x="664" y="660" font-family="sans-serif" font-size="18" fill="#111111">qualificati e statunitense. Il regolamento non pone alcun requisito di nazionalita,</text>
  <text x="664" y="686" font-family="sans-serif" font-size="18" fill="#111111">sede legale o controllo del capitale: quelle parole nel testo non compaiono mai.</text>
  <text x="664" y="726" font-family="sans-serif" font-size="17" fill="#6C757D">Nelle oltre 12.700 sono conteggiate anche le scuole. Non esiste alcun dato pubblico</text>
  <text x="664" y="750" font-family="sans-serif" font-size="17" fill="#6C757D">su quali infrastrutture siano finiti i dati degli studenti italiani.</text>

  <line x1="80" y1="836" x2="1520" y2="836" stroke="#6C757D" stroke-width="1"/>
  <text x="80" y="858" font-family="sans-serif" font-size="15" fill="#6C757D">Fonte: dichiarazione del Sottosegretario all'innovazione, 21 luglio 2026 (oltre 13.000 PA migrate, 75 per cento, 1,9 miliardi PNRR) - catalogo ACN delle qualificazioni, 2.107 schede e 826</text>
  <text x="80" y="878" font-family="sans-serif" font-size="15" fill="#6C757D">fornitori - ACN, Regolamento cloud per la PA, scansione lessicale del testo integrale. Osservatorio Nazionale Sovranita Digitale, 2026.</text>
