<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t07 d07">
  <title id="t07">280 contro oltre 12.700: dove sono davvero finite le amministrazioni migrate</title>
  <desc id="d07">Confronto proporzionale fra le oltre 280 amministrazioni centrali e ASL migrate sul Polo Strategico Nazionale e le oltre 12.700 amministrazioni locali e scuole migrate su cloud genericamente qualificati. Ogni punto vale cento amministrazioni.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="80" y="70" font-family="sans-serif" font-size="42" font-weight="700" fill="#111111">280 CONTRO OLTRE 12.700</text>
  <text x="80" y="108" font-family="sans-serif" font-size="23" fill="#6C757D">La migrazione annunciata il 21 luglio 2026, divisa per dove sono finiti gli enti</text>
  <line x1="80" y1="128" x2="1520" y2="128" stroke="#111111" stroke-width="3"/>

  <text x="80" y="172" font-family="sans-serif" font-size="18" font-weight="700" fill="#111111">Ogni punto vale 100 amministrazioni</text>

  <rect x="80" y="196" width="560" height="76" fill="#0066CC"/>
  <text x="360" y="228" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">OLTRE 280 PA CENTRALI E ASL</text>
  <text x="360" y="258" font-family="sans-serif" font-size="19" fill="#FFFFFF" text-anchor="middle">sul Polo Strategico Nazionale</text>
  <circle cx="150" cy="330" r="11" fill="#0066CC" stroke="#111111" stroke-width="1.5"/>
  <circle cx="184" cy="330" r="11" fill="#0066CC" stroke="#111111" stroke-width="1.5"/>
  <circle cx="218" cy="330" r="11" fill="#0066CC" stroke="#111111" stroke-width="1.5"/>

  <rect x="80" y="560" width="560" height="230" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <text x="104" y="600" font-family="sans-serif" font-size="20" font-weight="700" fill="#0066CC">Qui la linea tiene.</text>
  <text x="104" y="634" font-family="sans-serif" font-size="18" fill="#111111">I nove servizi di livello massimo QC4 sono</text>
  <text x="104" y="660" font-family="sans-serif" font-size="18" fill="#111111">tutti e soli nativi del PSN. Sulla fascia dei</text>
  <text x="104" y="686" font-family="sans-serif" font-size="18" fill="#111111">dati strategici il presidio esiste.</text>
  <text x="104" y="726" font-family="sans-serif" font-size="17" fill="#6C757D">Il PSN dichiara pero di erogare servizi anche</text>
  <text x="104" y="750" font-family="sans-serif" font-size="17" fill="#6C757D">in partnership con quattro hyperscaler</text>
  <text x="104" y="774" font-family="sans-serif" font-size="17" fill="#6C757D">statunitensi.</text>

  <rect x="640" y="196" width="880" height="76" fill="#D9364F"/>
  <text x="1080" y="228" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">OLTRE 12.700 PA LOCALI E SCUOLE</text>
  <text x="1080" y="258" font-family="sans-serif" font-size="19" fill="#FFFFFF" text-anchor="middle">su cloud genericamente qualificati</text>
