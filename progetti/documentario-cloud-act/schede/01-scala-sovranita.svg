<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t01 d01">
  <title id="t01">La scala della sovranita del cloud: cinque livelli e l'esposizione al CLOUD Act</title>
  <desc id="d01">Cinque livelli crescenti, dal cloud globale statunitense all'infrastruttura europea nativa, con indicata per ciascuno l'esposizione alla legge extraterritoriale statunitense: piena, mitigata o esclusa.</desc>

  <defs>
    <pattern id="hatch01" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#FFFFFF"/>
      <rect width="4" height="10" fill="#D9364F"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <!-- Titolo -->
  <text x="80" y="78" font-family="sans-serif" font-size="44" font-weight="700" fill="#111111">LA SCALA DELLA SOVRANITA</text>
  <text x="80" y="118" font-family="sans-serif" font-size="24" fill="#6C757D">Cinque livelli di autonomia del cloud, e cosa cambia davvero rispetto al CLOUD Act statunitense</text>
  <line x1="80" y1="140" x2="1520" y2="140" stroke="#111111" stroke-width="3"/>

  <!-- Intestazioni di colonna -->
  <text x="80" y="182" font-family="sans-serif" font-size="18" font-weight="700" fill="#6C757D">LIVELLO</text>
  <text x="1185" y="182" font-family="sans-serif" font-size="18" font-weight="700" fill="#6C757D">ESPOSIZIONE AL CLOUD ACT</text>

  <!-- LIVELLO 5 -->
  <rect x="330" y="200" width="820" height="106" fill="#1D9E75" stroke="#111111" stroke-width="2"/>
  <circle cx="382" cy="253" r="30" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="382" y="266" font-family="sans-serif" font-size="34" font-weight="700" fill="#111111" text-anchor="middle">5</text>
  <text x="432" y="243" font-family="sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">INFRASTRUTTURA EUROPEA NATIVA</text>
  <text x="432" y="277" font-family="sans-serif" font-size="19" fill="#FFFFFF">Fornitore europeo, capitale europeo, tecnologia e gestione proprie</text>
  <rect x="1180" y="216" width="340" height="74" fill="#FFFFFF" stroke="#1D9E75" stroke-width="4"/>
  <text x="1350" y="252" font-family="sans-serif" font-size="27" font-weight="700" fill="#1D9E75" text-anchor="middle">ESCLUSA</text>
  <text x="1350" y="278" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle">nessun aggancio giurisdizionale USA</text>

  <!-- LIVELLO 4 -->
  <rect x="272" y="330" width="878" height="106" fill="#1D9E75" fill-opacity="0.55" stroke="#111111" stroke-width="2"/>
  <circle cx="324" cy="383" r="30" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="324" y="396" font-family="sans-serif" font-size="34" font-weight="700" fill="#111111" text-anchor="middle">4</text>
  <text x="374" y="373" font-family="sans-serif" font-size="27" font-weight="700" fill="#111111">CLOUD DI FIDUCIA</text>
  <text x="374" y="407" font-family="sans-serif" font-size="19" fill="#111111">Tecnologia USA in licenza, ma societa e personale locali operano il servizio</text>
  <rect x="1180" y="346" width="340" height="74" fill="#FFFFFF" stroke="#1D9E75" stroke-width="4"/>
  <text x="1350" y="382" font-family="sans-serif" font-size="27" font-weight="700" fill="#1D9E75" text-anchor="middle">MITIGATA (forte)</text>
  <text x="1350" y="408" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle">dipende dalla separazione societaria</text>

  <!-- LIVELLO 3 -->
  <rect x="214" y="460" width="936" height="106" fill="#6C757D" stroke="#111111" stroke-width="2"/>
  <circle cx="266" cy="513" r="30" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="266" y="526" font-family="sans-serif" font-size="34" font-weight="700" fill="#111111" text-anchor="middle">3</text>
  <text x="316" y="503" font-family="sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">SOVRANITA CONTRATTUALE E TECNICA</text>
  <text x="316" y="537" font-family="sans-serif" font-size="19" fill="#FFFFFF">Clausole, cifratura, chiavi del cliente, confidential computing dove attivato</text>
  <rect x="1180" y="476" width="340" height="74" fill="#FFFFFF" stroke="#6C757D" stroke-width="4"/>
  <text x="1350" y="512" font-family="sans-serif" font-size="27" font-weight="700" fill="#6C757D" text-anchor="middle">MITIGATA</text>
  <text x="1350" y="538" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle">l'obbligo resta in capo alla casa madre</text>

  <!-- LIVELLO 2 -->
  <rect x="156" y="590" width="994" height="106" fill="url(#hatch01)" stroke="#111111" stroke-width="2"/>
  <rect x="156" y="590" width="994" height="106" fill="#D9364F" fill-opacity="0.85"/>
  <rect x="156" y="590" width="994" height="106" fill="none" stroke="#111111" stroke-width="2"/>
  <circle cx="208" cy="643" r="30" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="208" y="656" font-family="sans-serif" font-size="34" font-weight="700" fill="#111111" text-anchor="middle">2</text>
  <text x="258" y="633" font-family="sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">RESIDENZA DEL DATO IN ITALIA O IN UE</text>
  <text x="258" y="667" font-family="sans-serif" font-size="19" fill="#FFFFFF">Il data center e in Europa, ma il fornitore resta soggetto a legge statunitense</text>
  <rect x="1180" y="606" width="340" height="74" fill="#FFFFFF" stroke="#D9364F" stroke-width="4"/>
  <text x="1350" y="642" font-family="sans-serif" font-size="27" font-weight="700" fill="#D9364F" text-anchor="middle">PIENA</text>
  <text x="1350" y="668" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle">la geografia non sposta la giurisdizione</text>

  <!-- LIVELLO 1 -->
  <rect x="98" y="720" width="1052" height="106" fill="#D9364F" stroke="#111111" stroke-width="2"/>
  <circle cx="150" cy="773" r="30" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="150" y="786" font-family="sans-serif" font-size="34" font-weight="700" fill="#111111" text-anchor="middle">1</text>
  <text x="200" y="763" font-family="sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">CLOUD GLOBALE STATUNITENSE</text>
  <text x="200" y="797" font-family="sans-serif" font-size="19" fill="#FFFFFF">Servizio standard, gestito dal fornitore, region a scelta del cliente</text>
  <rect x="1180" y="736" width="340" height="74" fill="#FFFFFF" stroke="#D9364F" stroke-width="4"/>
  <text x="1350" y="772" font-family="sans-serif" font-size="27" font-weight="700" fill="#D9364F" text-anchor="middle">PIENA</text>
  <text x="1350" y="798" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle">possesso, custodia o controllo, ovunque</text>

  <!-- Freccia della scala -->
  <path d="M 118 700 L 118 230" stroke="#111111" stroke-width="3" fill="none"/>
  <path d="M 118 214 L 108 240 L 128 240 Z" fill="#111111"/>
  <text x="104" y="470" font-family="sans-serif" font-size="17" font-weight="700" fill="#111111" transform="rotate(-90 104 470)" text-anchor="middle">AUTONOMIA CRESCENTE</text>

  <!-- Fonte -->
  <line x1="80" y1="836" x2="1520" y2="836" stroke="#6C757D" stroke-width="1"/>
  <text x="80" y="858" font-family="sans-serif" font-size="15" fill="#6C757D">Fonte: CLOUD Act, 18 U.S.C. 2713 e 2703 - ANSSI, SecNumCloud 3.2, par. 19.2 e 19.6 - ACN, Regolamento cloud per la PA, All. 4 - Microsoft, documentazione national clouds. Osservatorio</text>
  <text x="80" y="878" font-family="sans-serif" font-size="15" fill="#6C757D">Nazionale Sovranita Digitale, 2026.</text>
</svg>
