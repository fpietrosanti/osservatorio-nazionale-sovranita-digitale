<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t09 d09">
  <title id="t09">Sei anni, tre aziende, un solo no: le audizioni al Senato francese</title>
  <desc id="d09">Quattro audizioni davanti al Senato francese. Il 17 luglio 2019 Google France con Benoit Tabaka, il 18 luglio 2019 Microsoft con Marc Mosse e Mathieu Coulaud, il 3 settembre 2019 AWS France con Julien Groues e Stephan Hadinger: in nessuno dei tre casi la casella si oppure no risulta compilata, perche nessuno rispose si o no. Il 10 giugno 2025 Microsoft France con Anton Carniaux e il primo no esplicito in sei anni.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="80" y="70" font-family="sans-serif" font-size="42" font-weight="700" fill="#111111">SEI ANNI, TRE AZIENDE, UN SOLO NO</text>
  <text x="80" y="108" font-family="sans-serif" font-size="23" fill="#6C757D">Le audizioni degli hyperscaler davanti al Senato francese: un solo "no" in sei anni</text>
  <line x1="80" y1="128" x2="1520" y2="128" stroke="#111111" stroke-width="3"/>

  <!-- Intestazione della tabella -->
  <rect x="80" y="168" width="1440" height="40" fill="#6C757D"/>
  <text x="100" y="194" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">DATA</text>
  <text x="290" y="194" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">AZIENDA</text>
  <text x="500" y="194" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">CHI HA PARLATO</text>
  <text x="770" y="194" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">CHE COSA HA RISPOSTO</text>
  <text x="1390" y="194" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">HA GARANTITO?</text>

  <text x="1330" y="232" font-family="sans-serif" font-size="16" font-weight="700" fill="#6C757D" text-anchor="middle">SI</text>
  <text x="1450" y="232" font-family="sans-serif" font-size="16" font-weight="700" fill="#6C757D" text-anchor="middle">NO</text>

  <!-- RIGA 1 - Google France, 17 luglio 2019 -->
  <text x="100" y="278" font-family="sans-serif" font-size="18" font-weight="700" fill="#111111">17 luglio 2019</text>
  <text x="290" y="278" font-family="sans-serif" font-size="18" font-weight="700" fill="#6C757D">Google France</text>
  <text x="500" y="276" font-family="sans-serif" font-size="16" fill="#111111">Benoit Tabaka</text>
  <text x="770" y="278" font-family="sans-serif" font-size="17" fill="#111111">"quelle disposizioni non sono in vigore"</text>
  <rect x="1280" y="259" width="100" height="46" fill="#FFFFFF" stroke="#6C757D" stroke-width="2"/>
  <rect x="1400" y="259" width="100" height="46" fill="#FFFFFF" stroke="#6C757D" stroke-width="2"/>
  <line x1="80" y1="320" x2="1520" y2="320" stroke="#6C757D" stroke-width="1"/>

  <!-- RIGA 2 - Microsoft, 18 luglio 2019 -->
  <text x="100" y="358" font-family="sans-serif" font-size="18" font-weight="700" fill="#111111">18 luglio 2019</text>
  <text x="290" y="358" font-family="sans-serif" font-size="18" font-weight="700" fill="#6C757D">Microsoft</text>
  <text x="500" y="352" font-family="sans-serif" font-size="16" fill="#111111">Marc Mosse</text>
  <text x="500" y="374" font-family="sans-serif" font-size="16" fill="#111111">Mathieu Coulaud</text>
  <text x="770" y="358" font-family="sans-serif" font-size="17" fill="#6C757D">nessuna garanzia rilasciata sul punto</text>
  <rect x="1280" y="339" width="100" height="46" fill="#FFFFFF" stroke="#6C757D" stroke-width="2"/>
  <rect x="1400" y="339" width="100" height="46" fill="#FFFFFF" stroke="#6C757D" stroke-width="2"/>
  <line x1="80" y1="400" x2="1520" y2="400" stroke="#6C757D" stroke-width="1"/>

  <!-- RIGA 3 - AWS France, 3 settembre 2019 -->
  <text x="100" y="438" font-family="sans-serif" font-size="18" font-weight="700" fill="#111111">3 settembre 2019</text>
  <text x="290" y="438" font-family="sans-serif" font-size="18" font-weight="700" fill="#6C757D">AWS France</text>
  <text x="500" y="432" font-family="sans-serif" font-size="16" fill="#111111">Julien Groues</text>
  <text x="500" y="454" font-family="sans-serif" font-size="16" fill="#111111">Stephan Hadinger</text>
  <text x="770" y="438" font-family="sans-serif" font-size="17" fill="#111111">"noi applichiamo la legge"</text>
  <rect x="1280" y="419" width="100" height="46" fill="#FFFFFF" stroke="#6C757D" stroke-width="2"/>
  <rect x="1400" y="419" width="100" height="46" fill="#FFFFFF" stroke="#6C757D" stroke-width="2"/>
  <line x1="80" y1="480" x2="1520" y2="480" stroke="#6C757D" stroke-width="1"/>

  <!-- Separatore: i sei anni -->
  <line x1="80" y1="512" x2="1520" y2="512" stroke="#111111" stroke-width="3" stroke-dasharray="14 10"/>
  <rect x="700" y="494" width="200" height="36" fill="#FFFFFF"/>
  <text x="800" y="519" font-family="sans-serif" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">SEI ANNI</text>

  <!-- RIGA 4 - Microsoft France, 10 giugno 2025 -->
  <rect x="80" y="548" width="1440" height="96" fill="#FFFFFF" stroke="#D9364F" stroke-width="4"/>
  <rect x="80" y="548" width="12" height="96" fill="#D9364F"/>
  <text x="120" y="592" font-family="sans-serif" font-size="20" font-weight="700" fill="#D9364F">10 giugno 2025</text>
  <text x="290" y="592" font-family="sans-serif" font-size="20" font-weight="700" fill="#D9364F">Microsoft France</text>
  <text x="500" y="592" font-family="sans-serif" font-size="17" font-weight="700" fill="#111111">Anton Carniaux</text>
  <text x="770" y="592" font-family="sans-serif" font-size="20" font-weight="700" fill="#111111">"No, non posso garantirlo"</text>
  <text x="770" y="620" font-family="sans-serif" font-size="16" fill="#6C757D">direttore affari pubblici e giuridici, audito sotto giuramento</text>
  <rect x="1280" y="573" width="100" height="46" fill="#FFFFFF" stroke="#6C757D" stroke-width="2"/>
  <rect x="1400" y="573" width="100" height="46" fill="#D9364F" stroke="#111111" stroke-width="2"/>
  <text x="1450" y="605" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">NO</text>

  <!-- Come si legge la colonna vuota -->
  <rect x="80" y="664" width="1440" height="60" fill="#FFFFFF" stroke="#6C757D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="690" font-family="sans-serif" font-size="17" fill="#111111">Nelle tre audizioni del 2019 nessuno dei tre rispose si oppure no: per questo le caselle restano vuote.</text>
  <text x="100" y="713" font-family="sans-serif" font-size="17" fill="#6C757D">Il vuoto e un'assenza di risposta. Sono tre non-risposte equivalenti, e nessuna delle tre e una menzogna accertata.</text>

  <!-- Conclusione -->
  <rect x="80" y="738" width="1440" height="76" fill="#111111"/>
  <text x="800" y="770" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">10 GIUGNO 2025: IL PRIMO "NO" ESPLICITO IN SEI ANNI</text>
  <text x="800" y="798" font-family="sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle">Tutti auditi sotto giuramento - Senato francese, commissioni d'inchiesta 2019 e 2025</text>

  <line x1="80" y1="836" x2="1520" y2="836" stroke="#6C757D" stroke-width="1"/>
  <text x="80" y="858" font-family="sans-serif" font-size="15" fill="#6C757D">Fonte: Senato francese, commissione d'inchiesta sulla sovranita digitale, rapporto n. 7 (2019-2020), audizioni del 17 e 18 luglio e del 3 settembre 2019 - commissione d'inchiesta 2025,</text>
  <text x="80" y="878" font-family="sans-serif" font-size="15" fill="#6C757D">rapporto n. 830, audizione del 10 giugno 2025. Verbatim tradotti dal resoconto ufficiale. Osservatorio Nazionale Sovranita Digitale, 2026.</text>
</svg>
