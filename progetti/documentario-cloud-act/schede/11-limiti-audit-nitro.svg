<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t11 d11">
  <title id="t11">I limiti dichiarati dall'audit del sistema Nitro</title>
  <desc id="d11">Il perimetro dell'audit copre la sola revisione del progetto. Restano fuori il piano di controllo EC2, l'hypervisor, il firmware e le Nitro Card. L'auditor dichiara inoltre di essere pagato da AWS, di non avere eseguito test sui sistemi reali e di non fornire alcuna garanzia rispetto a modifiche tecniche future scelte o imposte. La parola imposte e dell'auditor.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="80" y="70" font-family="sans-serif" font-size="42" font-weight="700" fill="#111111">NESSUNA GARANZIA SU MODIFICHE IMPOSTE</text>
  <text x="80" y="108" font-family="sans-serif" font-size="23" fill="#6C757D">Che cosa copre l'audit del sistema Nitro, e che cosa l'auditor stesso dichiara di non coprire</text>
  <line x1="80" y1="128" x2="1520" y2="128" stroke="#111111" stroke-width="3"/>

  <text x="80" y="158" font-family="sans-serif" font-size="16" fill="#6C757D">La scheda non afferma un difetto tecnico del prodotto: elenca i confini che l'auditor ha dichiarato per il proprio lavoro.</text>

  <!-- Perimetro dell'audit -->
  <rect x="80" y="180" width="660" height="392" fill="#FFFFFF" stroke="#6C757D" stroke-width="4"/>
  <!-- Quattro tacche: il bordo destro si apre -->
  <rect x="734" y="212" width="12" height="44" fill="#FFFFFF"/>
  <rect x="734" y="308" width="12" height="44" fill="#FFFFFF"/>
  <rect x="734" y="404" width="12" height="44" fill="#FFFFFF"/>
  <rect x="734" y="500" width="12" height="44" fill="#FFFFFF"/>
  <line x1="740" y1="212" x2="790" y2="212" stroke="#D9364F" stroke-width="4"/>
  <line x1="740" y1="256" x2="790" y2="256" stroke="#D9364F" stroke-width="4"/>
  <line x1="740" y1="308" x2="790" y2="308" stroke="#D9364F" stroke-width="4"/>
  <line x1="740" y1="352" x2="790" y2="352" stroke="#D9364F" stroke-width="4"/>
  <line x1="740" y1="404" x2="790" y2="404" stroke="#D9364F" stroke-width="4"/>
  <line x1="740" y1="448" x2="790" y2="448" stroke="#D9364F" stroke-width="4"/>
  <line x1="740" y1="500" x2="790" y2="500" stroke="#D9364F" stroke-width="4"/>
  <line x1="740" y1="544" x2="790" y2="544" stroke="#D9364F" stroke-width="4"/>

  <text x="410" y="222" font-family="sans-serif" font-size="26" font-weight="700" fill="#111111" text-anchor="middle">PERIMETRO DELL'AUDIT</text>
  <text x="410" y="252" font-family="sans-serif" font-size="18" fill="#6C757D" text-anchor="middle">NCC Group, valutazione del sistema Nitro</text>

  <rect x="120" y="282" width="580" height="106" fill="#FFFFFF" stroke="#0066CC" stroke-width="3"/>
  <text x="410" y="322" font-family="sans-serif" font-size="22" font-weight="700" fill="#0066CC" text-anchor="middle">CIO CHE L'AUDIT COPRE</text>
  <text x="410" y="356" font-family="sans-serif" font-size="19" fill="#111111" text-anchor="middle">la revisione del progetto (design review)</text>

  <rect x="120" y="410" width="580" height="140" fill="#FFFFFF" stroke="#6C757D" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="410" y="446" font-family="sans-serif" font-size="22" font-weight="700" fill="#6C757D" text-anchor="middle">CIO CHE RESTA FUORI</text>
  <text x="410" y="478" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">piano di controllo EC2 - hypervisor</text>
  <text x="410" y="504" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">firmware - Nitro Card</text>
  <text x="410" y="532" font-family="sans-serif" font-size="16" fill="#6C757D" text-anchor="middle">il perimetro non si chiude</text>

  <!-- I quattro limiti dichiarati -->
  <text x="800" y="200" font-family="sans-serif" font-size="18" font-weight="700" fill="#6C757D">QUATTRO LIMITI DICHIARATI DALL'AUDITOR STESSO</text>

  <circle cx="826" cy="248" r="18" fill="#D9364F"/>
  <text x="826" y="255" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="860" y="243" font-family="sans-serif" font-size="20" font-weight="700" fill="#111111">PAGATO DA AWS</text>
  <text x="860" y="269" font-family="sans-serif" font-size="16" fill="#6C757D">L'auditor e retribuito dal soggetto che ha commissionato la verifica.</text>

  <circle cx="826" cy="332" r="18" fill="#D9364F"/>
  <text x="826" y="339" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="860" y="327" font-family="sans-serif" font-size="20" font-weight="700" fill="#111111">REVISIONE DEL PROGETTO, NON TEST DEI SISTEMI</text>
  <text x="860" y="353" font-family="sans-serif" font-size="16" fill="#6C757D">L'auditor dichiara di non poter attestare che l'implementazione</text>
  <text x="860" y="373" font-family="sans-serif" font-size="16" fill="#6C757D">corrisponda al progetto esaminato.</text>

  <circle cx="826" cy="428" r="18" fill="#D9364F"/>
  <text x="826" y="435" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="860" y="423" font-family="sans-serif" font-size="20" font-weight="700" fill="#111111">QUATTRO COMPONENTI FUORI PERIMETRO</text>
  <text x="860" y="449" font-family="sans-serif" font-size="16" fill="#6C757D">Piano di controllo EC2, hypervisor, firmware e Nitro Card.</text>

  <circle cx="826" cy="512" r="18" fill="#D9364F"/>
  <text x="826" y="519" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="860" y="507" font-family="sans-serif" font-size="20" font-weight="700" fill="#111111">NESSUNA GARANZIA SULLE MODIFICHE FUTURE</text>
  <text x="860" y="533" font-family="sans-serif" font-size="16" fill="#6C757D">"no assurance with regards to any future chosen or compelled</text>
  <text x="860" y="553" font-family="sans-serif" font-size="16" fill="#6C757D">technical changes"</text>

  <!-- La parola dell'auditor -->
  <rect x="80" y="596" width="1440" height="110" fill="#FFFFFF" stroke="#D9364F" stroke-width="4"/>
  <text x="110" y="646" font-family="sans-serif" font-size="18" fill="#6C757D">nell'originale inglese:</text>
  <text x="110" y="676" font-family="sans-serif" font-size="22" font-weight="700" fill="#6C757D">"compelled"</text>
  <text x="800" y="668" font-family="sans-serif" font-size="60" font-weight="700" fill="#D9364F" text-anchor="middle">IMPOSTE</text>
  <text x="1490" y="656" font-family="sans-serif" font-size="22" font-weight="700" fill="#111111" text-anchor="end">La parola e dell'auditor.</text>
  <text x="1490" y="682" font-family="sans-serif" font-size="17" fill="#6C757D" text-anchor="end">Non e una nostra deduzione.</text>

  <!-- Contrappeso obbligatorio -->
  <rect x="80" y="722" width="1440" height="76" fill="#FFFFFF" stroke="#6C757D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="750" font-family="sans-serif" font-size="17" fill="#6C757D">Contrappeso indipendente - Trail of Bits, valutazione non pagata da AWS: "you must completely trust AWS".</text>
  <text x="100" y="776" font-family="sans-serif" font-size="17" fill="#6C757D">Nessuno di questi quattro punti descrive un malfunzionamento: descrivono che cosa l'audit non ha esaminato.</text>

  <line x1="80" y1="836" x2="1520" y2="836" stroke="#6C757D" stroke-width="1"/>
  <text x="80" y="858" font-family="sans-serif" font-size="15" fill="#6C757D">Fonte: NCC Group, rapporto di valutazione del sistema AWS Nitro, letto per intero: i quattro limiti sono dichiarazioni dell'auditor contenute nel rapporto stesso - Trail of Bits,</text>
  <text x="80" y="878" font-family="sans-serif" font-size="15" fill="#6C757D">valutazione indipendente non commissionata da AWS. Osservatorio Nazionale Sovranita Digitale, 2026.</text>
</svg>
